<!doctype html>
<html lang="lv" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#fdf6f9">
<meta name="description" content="Lietiņas — privāts un elegants personīgais plānotājs">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lietiņas">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
<title>Lietiņas</title>
<script>
try{
  var t=localStorage.getItem('lietinas-theme');
  if(!t) t=localStorage.getItem('lietinas-dark')==='1'?'dark':'auto';
  var d=t==='dark'||(t==='auto'&&window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme=d?'dark':'light';
  var m=document.querySelector('meta[name="theme-color"]');
  if(m) m.setAttribute('content',d?'#100d10':'#fdf6f9');
}catch(e){}
</script>
</head>
<body>
<a class="skip" href="#app">Pāriet uz saturu</a>

<header class="topbar">
  <div class="wrap topbar-in">
    <div class="brand">
      <span class="brand-mark" id="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">Lietiņas</span>
    </div>
    <div class="topbar-actions">
      <button class="icon-btn" id="theme-btn" data-action="theme" aria-label="Mainīt izskatu"></button>
      <button class="icon-btn" id="settings-btn" data-action="settings" aria-label="Iestatījumi"></button>
    </div>
  </div>
</header>

<main class="wrap" id="app" tabindex="-1"></main>

<div class="fab-wrap">
  <div class="fab-inner">
    <button class="fab" id="fab" data-action="fab" aria-label="Pievienot ierakstu"></button>
  </div>
</div>

<nav class="dock-wrap" aria-label="Galvenā navigācija">
  <div class="dock" id="dock"></div>
</nav>

<div id="modal" class="modal" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<input id="backup-file" type="file" accept="application/json,.json" hidden>

<script src="app2.js?v=7"></script>
</body>
</html>
