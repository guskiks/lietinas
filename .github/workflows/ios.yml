name: Lietiņas iOS IPA

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Lejupielādēt projektu
        uses: actions/checkout@v4

      - name: Pārbaudīt Xcode
        run: xcodebuild -version

      - name: Palaist testus
        run: |
          xcodebuild test \
            -project ./Lietinas.xcodeproj \
            -scheme Lietinas \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            CODE_SIGNING_ALLOWED=NO

      - name: Izveidot Release build
        run: |
          xcodebuild build \
            -project ./Lietinas.xcodeproj \
            -scheme Lietinas \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN
